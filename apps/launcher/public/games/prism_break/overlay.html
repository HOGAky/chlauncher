<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Prism Break</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .hud{position:fixed;top:10px;right:10px}.dot{width:10px;height:10px;border-radius:50%;background:#3f8}
  .dot[data-s=reconnecting]{background:#f80}
  #score{position:fixed;top:14px;left:50%;transform:translateX(-50%);font:800 30px/1 monospace;text-shadow:0 2px 8px #000}
  #info{position:fixed;top:14px;left:18px;font:700 16px/1.4 monospace;text-shadow:0 2px 6px #000}
  .feed{position:fixed;left:12px;bottom:12px;font:13px/1.5 monospace;text-shadow:0 1px 4px #000;opacity:.9}
  .banners{position:fixed;top:26%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  .banner{font:800 38px/1.2 system-ui;text-shadow:0 3px 14px #000;animation:pop .3s}
  .banner.big{color:#ffd34d}.banner.bad{color:#ff6b6b}
  #board{position:fixed;top:56px;right:12px;font:12px/1.6 monospace;text-align:right;text-shadow:0 1px 4px #000;opacity:.85}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  #pause{position:fixed;inset:0;display:none;place-items:center;font:800 46px/1 system-ui;background:rgba(0,0,0,.5);text-shadow:0 3px 10px #000}
</style></head><body>
<canvas id="cv"></canvas>
<div id="score">0</div><div id="info"></div>
<div id="board"></div><div id="pause">ПАУЗА</div>
<script>
'use strict';
// Prism Break — арканоид: платформа ездит сама за мячом, зрители
// спавнят мячи (мультибол), расширяют платформу, ускоряют и ломают ряд
// блоков. Все мячи упали → новый раунд с минус-очками.
const BG = new URLSearchParams(location.search).get('bg');
if (BG) document.body.style.background = '#' + BG;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let HUD = null;
const GAME = 'prism_break';

const S = {
  cfg: null, eng: null, running: true,
  paddle: { x: 0.5, w: 0.14, wBoostUntil: 0 },
  balls: [], bricks: [], score: 0, best: 0, rounds: 0,
  level: 1, speedMult: 1, speedUntil: 0,
  supporters: {}, stats: { events: 0, gifts: 0, coins: 0 },
};

const BRICK_ROWS = 6, BRICK_COLS = 11;
const BALL_SPEED = 0.62;

function buildWall(level) {
  S.bricks = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      const hp = r < 2 ? Math.min(3, level) : 1;
      S.bricks.push({
        x: 0.05 + c * 0.082, y: 0.08 + r * 0.045,
        w: 0.078, h: 0.038, hp, max: hp,
        hue: (r * 40 + level * 17) % 360,
      });
    }
  }
}

function spawnBall(n = 1) {
  for (let i = 0; i < n; i++) {
    if (S.balls.length >= 8) break;
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
    S.balls.push({
      x: S.paddle.x, y: 0.9,
      vx: Math.cos(ang) * BALL_SPEED, vy: Math.sin(ang) * BALL_SPEED,
      r: 0.011,
    });
  }
}

function loseAll() {
  S.rounds++;
  S.best = Math.max(S.best, S.score);
  S.score = Math.max(0, S.score - 15);
  S.balls = [];
  spawnBall();
  HUD.banners.push('ВСЕ МЯЧИ УШЛИ!', 'bad');
  GameKit.sfx('warn', S.cfg.volume);
}

function clearRow() {
  if (!S.bricks.length) return;
  const minY = Math.min(...S.bricks.map((b) => b.y));
  const before = S.bricks.length;
  S.bricks = S.bricks.filter((b) => b.y > minY + 0.001);
  const n = before - S.bricks.length;
  S.score += n * 2;
  HUD.banners.push(`РЯД СНЕСЁН! +${n * 2}`, 'big');
  GameKit.sfx('big', S.cfg.volume);
}

function act(a) {
  if (a.per) a = { ...a, value: Math.max(1, Math.round((a.value || 1) * (a._count || 1) / a.per)) };
  if (a.per_coin) a = { ...a, value: Math.max(1, Math.round((a.value || 1) * (a._coins || 1) * a.per_coin)) };
  const u = a._user || '?';
  S.supporters[u] = (S.supporters[u] || 0) + 1;
  switch (a.type) {
    case 'add_ball': {
      spawnBall(a.value || 1);
      HUD.feed.push(`${u}: +${a.value || 1} мяч`);
      HUD.banners.push(S.balls.length > 2 ? 'МУЛЬТИБОЛ!' : 'НОВЫЙ МЯЧ!', 'big');
      GameKit.sfx('add', S.cfg.volume);
      break;
    }
    case 'widen': {
      S.paddle.wBoostUntil = Date.now() + (a.sec || 15) * 1000;
      HUD.feed.push(`${u}: платформа шире`);
      break;
    }
    case 'shrink_paddle': {
      S.paddle.w = Math.max(0.07, S.paddle.w - 0.02);
      setTimeout(() => (S.paddle.w = 0.14), (a.sec || 10) * 1000);
      HUD.banners.push('ПЛАТФОРМА УЗКАЯ!', 'bad');
      break;
    }
    case 'speed': {
      S.speedUntil = Date.now() + (a.sec || 10) * 1000;
      HUD.banners.push('УСКОРЕНИЕ МЯЧА!', 'big');
      break;
    }
    case 'clear_row': clearRow(); break;
    case 'score': {
      S.score += a.value || 1;
      HUD.feed.push(`${u}: +${a.value || 1} очков`);
      GameKit.sfx('coin', S.cfg.volume);
      break;
    }
  }
}

function step(dt) {
  if (!S.running) return;
  for (const a of S.eng.pump()) act(a);
  const wide = Date.now() < S.paddle.wBoostUntil;
  const pw = wide ? S.paddle.w * 1.6 : S.paddle.w;
  const sm = Date.now() < S.speedUntil ? 1.5 : 1;

  // autopilot: chase the lowest ball
  const lead = S.balls.reduce((m, b) => (b.y > (m?.y ?? -1) ? b : m), null);
  if (lead) {
    const tx = lead.x + lead.vx * 0.08;
    const dx = tx - S.paddle.x;
    S.paddle.x += Math.sign(dx) * Math.min(Math.abs(dx), 0.9 * dt);
  }
  S.paddle.x = Math.max(pw / 2, Math.min(1 - pw / 2, S.paddle.x));

  for (const b of S.balls) {
    b.x += b.vx * sm * dt; b.y += b.vy * sm * dt;
    if (b.x < b.r || b.x > 1 - b.r) { b.vx *= -1; b.x = Math.max(b.r, Math.min(1 - b.r, b.x)); }
    if (b.y < b.r) { b.vy = Math.abs(b.vy); }
    // paddle bounce
    if (b.vy > 0 && b.y + b.r > 0.93 && b.y - b.r < 0.95 && Math.abs(b.x - S.paddle.x) < pw / 2 + b.r) {
      const off = (b.x - S.paddle.x) / (pw / 2);
      const ang = -Math.PI / 2 + off * 1.1;
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
      GameKit.sfx('add', S.cfg.volume * 0.3);
    }
    // bricks
    for (const br of S.bricks) {
      if (b.x > br.x && b.x < br.x + br.w && b.y > br.y && b.y < br.y + br.h) {
        br.hp--;
        b.vy *= -1;
        if (br.hp <= 0) {
          S.bricks.splice(S.bricks.indexOf(br), 1);
          S.score += br.max;
          GameKit.sfx('coin', S.cfg.volume * 0.4);
        }
        break;
      }
    }
  }
  S.balls = S.balls.filter((b) => b.y < 1.05);
  if (!S.balls.length) { loseAll(); return; }
  if (!S.bricks.length) {
    S.level++;
    S.score += 50;
    HUD.banners.push(`УРОВЕНЬ ${S.level}!`, 'big');
    GameKit.sfx('win', S.cfg.volume);
    buildWall(S.level);
    spawnBall();
  }
}

function draw() {
  cv.width = cv.clientWidth; cv.height = cv.clientHeight;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const W = cv.width, H = cv.height;
  // bricks
  for (const b of S.bricks) {
    const alpha = 0.4 + 0.6 * (b.hp / b.max);
    ctx.fillStyle = `hsl(${b.hue} 75% 55% / ${alpha})`;
    ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.beginPath();
    ctx.roundRect(b.x * W, b.y * H, b.w * W - 2, b.h * H - 2, 4);
    ctx.fill(); ctx.stroke();
  }
  // paddle
  const wide = Date.now() < S.paddle.wBoostUntil;
  const pw = (wide ? S.paddle.w * 1.6 : S.paddle.w) * W;
  ctx.fillStyle = wide ? '#7dd8ff' : '#e8ecf4';
  ctx.beginPath();
  ctx.roundRect(S.paddle.x * W - pw / 2, 0.93 * H, pw, 0.018 * H, 6);
  ctx.fill();
  // balls
  ctx.fillStyle = '#ffd34d';
  for (const b of S.balls) {
    ctx.beginPath(); ctx.arc(b.x * W, b.y * H, b.r * W, 0, Math.PI * 2); ctx.fill();
  }
  document.getElementById('score').textContent = `★ ${S.score}`;
  document.getElementById('info').textContent =
    `УР. ${S.level} · МЯЧИ ${S.balls.length} · РЕКОРД ${S.best}`;
  document.getElementById('board').innerHTML =
    GameKit.leaderboard(S.supporters, 5).map((r, i) => `${i + 1}. ${GameKit.esc(r.user)} — ${GameKit.fmtNum(r.score)}`).join('<br>');
}

async function main() {
  HUD = GameKit.hud();
  const { cfg } = await GameKit.fetchCfg(GAME);
  S.cfg = cfg;
  S.eng = new GameKit.Engine(cfg);
  buildWall(1);
  spawnBall();
  GameKit.connect(['game'], (ev) => {
    if (ev.event_kind === 'gift') { S.stats.gifts++; S.stats.coins += ev.coins || 0; }
    S.eng.feed(ev);
  }, (s) => HUD.setStatus(s));
  GameKit.watchSession(GAME, (status) => {
    document.getElementById('pause').style.display = status === 'paused' ? 'grid' : 'none';
    S.running = status === 'running';
  });
  GameKit.unloadReport(GAME, () => {
    if (!S.cfg) return null;
    return {
      duration_s: 0,
      winner: `score ${S.score} lvl ${S.level}`,
      score: { score: S.score, best: S.best, level: S.level },
      top: GameKit.leaderboard(S.supporters, 5),
      stats: S.stats,
    };
  });
  HUD.banners.push('PRISM BREAK — зрители бросают мячи!', 'big');
  GameKit.loop(step, draw);
}
{
  const s = document.createElement('script');
  s.src = '/gamekit.js?t=' + encodeURIComponent(new URLSearchParams(location.search).get('t') || '');
  s.onload = () => main().catch((e) => {
    document.body.innerHTML = '<pre id="err" style="color:#f66;padding:20px"></pre>';
    document.getElementById('err').textContent = String(e);
  });
  s.onerror = () => { document.body.innerHTML = '<pre style="color:#f66;padding:20px">gamekit: 403 — проверьте токен</pre>'; };
  document.head.appendChild(s);
}
</script></body></html>
