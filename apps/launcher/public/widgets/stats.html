<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Stats Widget</title>
<style>
  :root{
    --fd:'Anton'; --fb:'Space Grotesk';
    --a1:#eef2f6; --a2:#8d969f; --a3:#ffffff;
    --ink:#f2f5f8; --mut:#9aa4ad;
    --panel:linear-gradient(170deg, rgba(18,20,24,.92), rgba(6,7,9,.95));
    --line:rgba(220,228,236,.4); --glow:rgba(255,255,255,.35);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
  .stage {
    position:absolute; left:50%; top:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    font-family:var(--fb), sans-serif; color:var(--ink);
  }
  .wrap { position:absolute; inset:0; padding:230px 70px 0; display:flex; flex-direction:column; gap:44px; }

  .stat {
    position:relative; padding:46px 54px;
    background:var(--panel);
    border:2px solid var(--line); border-radius:34px;
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:space-between;
  }
  .stat::before {
    content:''; position:absolute; left:0; top:18%; bottom:18%; width:10px;
    border-radius:10px; background:var(--ac, var(--a1));
    box-shadow:0 0 22px var(--ac, var(--a1));
  }
  .s-label { font-size:30px; letter-spacing:8px; color:var(--mut); text-transform:uppercase; font-weight:600; }
  .s-icon { font-size:52px; display:block; margin-bottom:8px; }
  .s-value {
    font-family:var(--fd); font-size:110px; line-height:1; color:var(--ac, var(--a1));
    letter-spacing:2px;
  }
  .s-viewers { --ac:#5ef2ff; } .s-likes { --ac:#ff5fa2; } .s-gifts { --ac:#ffe14d; } .s-king { --ac:#c9f74a; }

  .king-stat { flex-direction:column; align-items:center; text-align:center; padding:60px 54px; }
  .k-label { font-size:30px; letter-spacing:8px; color:var(--mut); text-transform:uppercase; font-weight:600; }
  .k-ava {
    width:220px; height:220px; border-radius:50%; object-fit:cover; margin:36px 0 24px;
    border:6px solid var(--ac, var(--a1)); background:#14161a;
    box-shadow:0 0 44px color-mix(in srgb, var(--ac, var(--a1)) 50%, transparent), 0 16px 30px rgba(0,0,0,.5);
  }
  .k-nick { font-family:var(--fd); font-size:64px; color:var(--ac, var(--a1)); letter-spacing:2px; text-transform:uppercase; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .k-coins { margin-top:10px; font-size:34px; font-weight:600; color:var(--ink); letter-spacing:2px; }
  .k-crown { font-size:70px; margin-bottom:-8px; filter:drop-shadow(0 0 16px rgba(255,210,63,.7)); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="wrap">
    <div class="stat s-viewers">
      <div><span class="s-icon">&#128065;</span><span class="s-label">Зрители</span></div>
      <div class="s-value" id="viewers">0</div>
    </div>
    <div class="stat s-likes">
      <div><span class="s-icon">&#10084;</span><span class="s-label">Лайки</span></div>
      <div class="s-value" id="likes">0</div>
    </div>
    <div class="stat s-gifts">
      <div><span class="s-icon">&#127873;</span><span class="s-label">Подарки</span></div>
      <div class="s-value" id="gifts">0</div>
    </div>
    <div class="stat s-king king-stat">
      <div class="k-crown">&#128081;</div>
      <div class="k-label">Топ-донатер эфира</div>
      <img class="k-ava" id="kava" src="">
      <div class="k-nick fx-text" id="knick">—</div>
      <div class="k-coins" id="kcoins"></div>
    </div>
  </div>
</div>
<script src="bridge.js"></script>
<script src="themes.js"></script>
<script>
  TTW.apply('chrome');
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const $ = id => document.getElementById(id);
  const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);

  io().on('state', s => {
    $('viewers').textContent = fmt(s.room ? s.room.viewers : 0);
    $('likes').textContent = fmt(s.likes.total);
    $('gifts').textContent = fmt(s.room ? s.room.giftsCount : 0);
    const k = s.gifts.top[0];
    if (k) {
      $('kava').src = k.avatar || 'https://api.dicebear.com/9.x/thumbs/png?seed='+encodeURIComponent(k.nickname);
      $('knick').textContent = k.nickname;
      $('kcoins').innerHTML = fmt(k.coins) + ' &#128142; за эфир';
    }
  });
</script>
</body>
</html>
