<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Chat Widget</title>
<style>
  :root{
    --fd:'Anton'; --fb:'Space Grotesk';
    --a1:#eef2f6; --a2:#8d969f; --a3:#ffffff;
    --ink:#f2f5f8; --mut:#9aa4ad;
    --panel:linear-gradient(170deg, rgba(18,20,24,.92), rgba(6,7,9,.95));
    --line:rgba(220,228,236,.4); --glow:rgba(255,255,255,.35);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
  .stage {
    position:absolute; left:50%; top:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    font-family:var(--fb), sans-serif; color:var(--ink);
  }
  .wrap {
    position:absolute; left:60px; right:60px; bottom:340px; top:220px;
    display:flex; flex-direction:column; justify-content:flex-end; gap:18px;
    mask-image:linear-gradient(180deg, transparent, #000 12%);
    -webkit-mask-image:linear-gradient(180deg, transparent, #000 12%);
  }
  .msg {
    display:flex; gap:20px; align-items:flex-start;
    padding:20px 26px;
    background:var(--panel);
    border:1.5px solid var(--line);
    border-radius:26px;
    box-shadow:0 14px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1);
    backdrop-filter:blur(8px);
    animation:msgIn .45s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes msgIn { 0%{opacity:0; transform:translateY(40px) scale(.92)} 100%{opacity:1; transform:none} }
  .msg.out { transition:opacity .4s, transform .4s; opacity:0; transform:translateX(-60px); }
  .m-ava {
    width:74px; height:74px; flex:none; border-radius:50%; object-fit:cover;
    border:3px solid var(--a1); background:#14161a;
    box-shadow:0 0 16px color-mix(in srgb, var(--a1) 40%, transparent);
  }
  .m-body { min-width:0; }
  .m-nick {
    font-family:var(--fd); font-size:30px; letter-spacing:2px; color:var(--a1);
    text-transform:uppercase; margin-bottom:6px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .m-text {
    font-size:36px; line-height:1.3; font-weight:500; color:var(--ink);
    word-break:break-word;
  }
  .chat-tag {
    position:absolute; left:60px; top:170px;
    font-family:var(--fd); font-size:34px; letter-spacing:6px; color:var(--mut);
    text-transform:uppercase;
  }
  .chat-tag b { color:var(--a1); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="chat-tag"><b>LIVE</b> CHAT</div>
  <div class="wrap" id="wrap"></div>
</div>
<script src="bridge.js"></script>
<script src="themes.js"></script>
<script>
  TTW.apply('chrome');
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const wrap = document.getElementById('wrap');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const MAX = 9;

  io().on('chat', d => {
    const el = document.createElement('div');
    el.className = 'msg';
    el.innerHTML = `
      <img class="m-ava" src="${esc(d.avatar || 'https://api.dicebear.com/9.x/thumbs/png?seed='+encodeURIComponent(d.nickname||'x'))}">
      <div class="m-body">
        <div class="m-nick">${esc(d.nickname||'???')}</div>
        <div class="m-text">${esc(d.comment||'')}</div>
      </div>`;
    wrap.appendChild(el);
    while (wrap.children.length > MAX) {
      const first = wrap.firstElementChild;
      first.classList.add('out');
      setTimeout(() => first.remove(), 400);
      break;
    }
  });
</script>
</body>
</html>
