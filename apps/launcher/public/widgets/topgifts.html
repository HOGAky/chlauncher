<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Top Gifters Widget</title>
<style>
  :root{
    --fd:'Cinzel'; --fb:'Playfair Display';
    --a1:#e9c860; --a2:#d4af37; --a3:#a67c1b;
    --ink:#f4e8c8; --mut:#b9a068;
    --panel:linear-gradient(165deg, rgba(22,20,18,.88), rgba(8,8,10,.92));
    --line:rgba(212,175,55,.55); --glow:rgba(212,175,55,.5);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
  .stage {
    position:absolute; left:50%; top:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    font-family:var(--fb), serif; color:var(--ink);
  }
  .wrap { position:absolute; inset:0; padding:180px 80px 0; }

  .panel {
    position:relative; padding:70px 60px 60px;
    background:var(--panel);
    border-radius:34px;
    border:1.5px solid var(--line);
    box-shadow:
      0 0 0 6px rgba(20,18,16,.6),
      0 0 0 7.5px var(--line),
      0 30px 80px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,235,180,.25);
    backdrop-filter:blur(14px);
  }
  .panel::before {
    content:''; position:absolute; top:0; left:8%; right:8%; height:2px;
    background:linear-gradient(90deg, transparent, var(--a1), transparent);
  }
  .corner { position:absolute; width:44px; height:44px; border:3px solid var(--a2); opacity:.9; }
  .corner.tl{ top:16px; left:16px; border-right:0; border-bottom:0; border-radius:14px 0 0 0; }
  .corner.tr{ top:16px; right:16px; border-left:0; border-bottom:0; border-radius:0 14px 0 0; }
  .corner.bl{ bottom:16px; left:16px; border-right:0; border-top:0; border-radius:0 0 0 14px; }
  .corner.br{ bottom:16px; right:16px; border-left:0; border-top:0; border-radius:0 0 14px 0; }

  .title {
    text-align:center; font-family:var(--fd); font-weight:800;
    font-size:58px; letter-spacing:8px; color:var(--a1);
    text-shadow:0 3px 6px rgba(0,0,0,.7);
  }
  .title-sub { text-align:center; margin-top:10px; font-style:italic; font-size:26px; color:var(--mut); letter-spacing:4px; }
  .divider {
    margin:34px auto 0; width:70%; height:1.5px;
    background:linear-gradient(90deg, transparent, var(--a2) 30%, var(--a1) 50%, var(--a2) 70%, transparent);
    position:relative;
  }
  .divider::after { content:'\2666'; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--a1); font-size:26px; }

  .podium { display:flex; align-items:flex-end; justify-content:center; gap:26px; margin-top:56px; }
  .p { text-align:center; position:relative; }
  .p .crown { font-size:64px; filter:drop-shadow(0 0 14px var(--glow)); margin-bottom:-14px; position:relative; z-index:2; animation:crownFloat 3s ease-in-out infinite; }
  .p .ava {
    border-radius:50%; object-fit:cover; display:block; margin:0 auto;
    border:4px solid var(--mc);
    box-shadow:0 0 30px color-mix(in srgb, var(--mc) 60%, transparent), inset 0 0 20px rgba(0,0,0,.4);
    background:#1a1712; position:relative; z-index:1;
  }
  .p1 .ava { width:210px; height:210px; border-width:5px; }
  .p2 .ava, .p3 .ava { width:150px; height:150px; }
  .p .nick { margin-top:18px; font-size:30px; font-weight:600; color:var(--ink); max-width:290px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p .coins {
    display:inline-block; margin-top:8px; padding:6px 26px; border-radius:30px;
    font-family:var(--fd); font-weight:800; font-size:28px; letter-spacing:2px;
    color:#1a1408;
    background:linear-gradient(180deg,var(--a1),var(--a2) 60%,var(--a3));
    box-shadow:0 4px 14px var(--glow), inset 0 1px 0 #fff8;
  }
  .p .place {
    margin-top:14px; font-family:var(--fd); font-size:22px; letter-spacing:5px; color:var(--mc);
  }
  .p1 { --mc:#ffd23f; } .p2 { --mc:#cfd8dc; } .p3 { --mc:#cd8a5a; }

  .list { margin-top:52px; }
  .row {
    display:flex; align-items:center; gap:20px;
    padding:13px 26px; margin-bottom:12px; border-radius:16px;
    background:linear-gradient(90deg, color-mix(in srgb, var(--a2) 10%, transparent), color-mix(in srgb, var(--a2) 3%, transparent));
    border:1px solid color-mix(in srgb, var(--a2) 28%, transparent);
  }
  .row .num { font-family:var(--fd); font-weight:800; font-size:26px; color:var(--a1); width:56px; }
  .row .mini-ava { width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid var(--line); background:#221d14; }
  .row .rnick { flex:1; font-size:26px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .rcoins { font-family:var(--fd); font-weight:600; font-size:25px; color:var(--a1); letter-spacing:1px; }
  .empty { text-align:center; font-style:italic; color:var(--mut); font-size:28px; margin-top:60px; }

  @keyframes crownFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="wrap">
    <div class="panel">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>

      <div class="title fx-text" id="hTitle">TOP GIFTERS</div>
      <div class="title-sub" id="hSub">— legends of this live —</div>
      <div class="divider"></div>

      <div class="podium" id="podium"></div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty">Ожидаем первых героев эфира…</div>
    </div>
  </div>
</div>
<script src="bridge.js"></script>
<script src="themes.js"></script>
<script>
  TTW.apply('luxury');
  const _q = new URLSearchParams(location.search);
  if (_q.get('title')) document.getElementById('hTitle').textContent = _q.get('title');
  if (_q.get('sub'))   document.getElementById('hSub').textContent   = _q.get('sub');
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ava = u => u.avatar || `https://api.dicebear.com/9.x/thumbs/png?seed=${encodeURIComponent(u.nickname)}`;
  const socket = io();

  socket.on('state', s => {
    const top = s.gifts.top;
    document.getElementById('empty').style.display = top.length ? 'none' : 'block';

    const p1 = top[0], p2 = top[1], p3 = top[2];
    const slot = (u, cls, place) => u ? `
      <div class="p ${cls}">
        ${cls==='p1' ? '<div class="crown">&#128081;</div>' : ''}
        <img class="ava" src="${ava(u)}" onerror="this.src='https://api.dicebear.com/9.x/thumbs/png?seed=x${place}'">
        <div class="nick">${esc(u.nickname)}</div>
        <div class="coins">${fmt(u.coins)} &#128142;</div>
        <div class="place">${place} PLACE</div>
      </div>` : '';

    document.getElementById('podium').innerHTML = slot(p2,'p2','II') + slot(p1,'p1','I') + slot(p3,'p3','III');

    document.getElementById('list').innerHTML = top.slice(3).map((u,i)=>`
      <div class="row">
        <div class="num">${i+4}.</div>
        <img class="mini-ava" src="${ava(u)}">
        <div class="rnick">${esc(u.nickname)}</div>
        <div class="rcoins">${fmt(u.coins)} &#128142;</div>
      </div>`).join('');
  });
</script>
</body>
</html>
