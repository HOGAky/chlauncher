<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Gift Combo</title>
<style>
  :root{
    --fd:'Bangers'; --fb:'Russo One';
    --a1:#ffb03a; --a2:#ff5722; --a3:#ffe9a3;
    --ink:#fff3e0; --mut:#d99a6c;
    --panel:linear-gradient(170deg, rgba(40,14,4,.92), rgba(16,6,2,.95));
    --line:#ffb03a; --glow:#ff5722;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
  .stage {
    position:absolute; left:50%; top:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    font-family:var(--fb), sans-serif; color:var(--ink);
  }
  .wrap { position:absolute; inset:0; padding:300px 70px 0; display:flex; flex-direction:column; align-items:center; }

  .badge {
    font-family:var(--fd); font-size:60px; letter-spacing:6px; text-transform:uppercase;
    background:var(--a2); color:#fff; padding:14px 46px; border-radius:60px;
    border:4px solid var(--a3); transform:rotate(-2deg);
    box-shadow:0 12px 0 rgba(0,0,0,.45), 0 24px 44px rgba(0,0,0,.5);
    margin-bottom:56px;
  }
  .gift-img {
    width:280px; height:280px; object-fit:contain;
    filter:drop-shadow(0 0 40px var(--glow)) drop-shadow(0 20px 30px rgba(0,0,0,.6));
    animation:float 2.4s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-18px) scale(1.04)} }
  .count { font-family:var(--fd); font-size:300px; line-height:1; margin-top:10px; }
  .count.bump { animation:bump .3s cubic-bezier(.22,1.6,.36,1); }
  @keyframes bump { 0%{transform:scale(1.35)} 100%{transform:scale(1)} }
  .nick { font-size:44px; font-weight:700; color:var(--a1); margin-top:30px;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec { margin-top:26px; font-size:32px; letter-spacing:4px; color:var(--mut); text-transform:uppercase; }
  .flame { font-size:80px; margin-top:8px; filter:drop-shadow(0 0 24px var(--glow)); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="wrap">
    <div class="badge" id="badge">СЕРИЯ</div>
    <img class="gift-img" id="gimg" src="" style="display:none">
    <div class="count fx-text" id="count">×0</div>
    <div class="nick" id="nick"></div>
    <div class="flame" id="flame" style="display:none">🔥</div>
    <div class="rec" id="rec"></div>
  </div>
</div>
<script src="bridge.js"></script>
<script src="themes.js"></script>
<script>
  TTW.apply('fire');
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const q = new URLSearchParams(location.search);
  const mono = (q.get('mono') || '').trim().toLowerCase();
  const TIMEOUT = (parseInt(q.get('sec'), 10) || 8) * 1000;
  const $ = id => document.getElementById(id);
  if (q.get('title')) $('badge').textContent = q.get('title');

  let curGift = null, curNick = '', count = 0, best = 0, timer = null, img = '';

  function reset() {
    count = 0; curGift = null; curNick = ''; img = '';
    $('count').textContent = '×0';
    $('nick').textContent = '';
    $('gimg').style.display = 'none';
    $('flame').style.display = 'none';
    timer = null;
  }

  io().on('alert', d => {
    if (d.type !== 'gift') return;
    const name = (d.giftName || '').trim().toLowerCase();
    if (mono && name !== mono) return;
    const n = Math.max(1, d.count || 1);
    if (curGift !== name) { count = 0; curGift = name; }
    count += n;
    curNick = d.nickname;
    img = d.image || img;
    best = Math.max(best, count);

    if (img) { $('gimg').src = img; $('gimg').style.display = 'block'; }
    $('count').textContent = '×' + count;
    $('nick').textContent = curNick;
    $('rec').textContent = 'рекорд серии: ×' + best;
    $('flame').style.display = count >= 10 ? 'block' : 'none';

    const c = $('count');
    c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');

    clearTimeout(timer);
    timer = setTimeout(reset, TIMEOUT);
  });
</script>
</body>
</html>
