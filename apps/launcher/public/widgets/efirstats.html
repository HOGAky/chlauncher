<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>EFIR Stats</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
  .stage {
    position:absolute; left:50%; top:50%;
    width:700px; height:420px;
    transform-origin:center center;
    font-family:'Russo One','Rubik',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  }
  .row {
    width:640px; padding:26px 36px; border-radius:20px;
    background:var(--rs,#111827); border:2px solid var(--rp,#6366f1);
    box-shadow:0 0 26px color-mix(in srgb, var(--rp,#6366f1) 35%, transparent);
    display:flex; align-items:baseline; justify-content:space-between;
    transition:background .25s, border-color .25s, box-shadow .25s;
  }
  /* Прозрачный режим — только цифры со свечением */
  .stage.transparent .row {
    background:transparent; border-color:transparent; box-shadow:none;
  }
  .stage.transparent .row .k { color:var(--rt,#fff); opacity:.85;
    text-shadow:0 0 12px rgba(0,0,0,.9), 2px 2px 0 rgba(0,0,0,.5); }
  .row .k { font-size:26px; letter-spacing:4px; color:#9ca3af; }
  .row .v { font-size:56px; font-weight:700; color:var(--rp2,#f59e0b); font-variant-numeric:tabular-nums;
            text-shadow:0 0 18px color-mix(in srgb, var(--rp2,#f59e0b) 65%, transparent); }
  .row.hero .v { font-size:64px; color:#fff; }
  .row.hero .k { color:var(--rp,#6366f1); }

  /* ---- дождь розовых сердечек при тапах ---- */
  .hearts { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .heart { position:absolute; top:-40px; font-size:var(--hs,28px); opacity:0;
    animation:heartFall var(--hd,3.4s) ease-in forwards; }
  @keyframes heartFall {
    0%   { opacity:0; transform:translateY(0) translateX(0) scale(.6) rotate(0deg); }
    12%  { opacity:1; }
    60%  { transform:translateY(var(--hy,300px)) translateX(var(--hx,20px)) scale(1) rotate(var(--hr,12deg)); }
    100% { opacity:0; transform:translateY(calc(var(--hy,300px) + 140px)) translateX(calc(var(--hx,20px)*-1)) scale(.8) rotate(calc(var(--hr,12deg)*-1)); }
  }
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="stage" id="stage">
  <div class="row hero"><span class="k" id="uptimeK">АПТАЙМ СТРИМА</span><span class="v" id="uptime">00:00:00</span></div>
  <div class="row"><span class="k" id="nextK">ДО РУЛЕТКИ</span><span class="v" id="next">0 ❤</span></div>
</div>
<div id="tb" style="position:fixed;top:0;left:0;right:0;height:30px;z-index:99;display:none;align-items:center;justify-content:flex-end;gap:6px;background:rgba(10,10,20,.55);backdrop-filter:blur(4px);font-family:system-ui">
  <span style="flex:1;padding-left:10px;font-size:12px;color:#9ca3af;letter-spacing:2px" data-tauri-drag-region>EFIR STATS</span>
  <button id="tbClose" style="width:26px;height:22px;margin-right:4px;border:0;border-radius:5px;background:#7f1d1d;color:#fff;cursor:pointer;font-size:13px;line-height:1">✕</button>
</div>
<script>
(function(){
  const Q = new URLSearchParams(location.search);
  const token = Q.get('t') || '';
  const demo = Q.get('demo') === '1';

  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(innerWidth/700, innerHeight/420);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const el = id => document.getElementById(id);
  const esc = s => String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const fmtHMS = s => {
    s = Math.max(0, s|0);
    return String(Math.floor(s/3600)).padStart(2,'0') + ':' +
           String(Math.floor(s/60)%60).padStart(2,'0') + ':' +
           String(s%60).padStart(2,'0');
  };
  const fmtK = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'K' : String(n);

  let state = null, cfg = null, lastLikes = -1;

  function render(){
    const s = state || {};
    // Аптайм — от даты/времени старта стрима из настроек (uptimeStartTime),
    // иначе от старта текущего запуска таймера.
    let up = 0;
    if (cfg && cfg.uptimeStartTime){
      const t0 = Date.parse(cfg.uptimeStartTime);
      if (!isNaN(t0)) up = Math.floor((Date.now()-t0)/1000);
    }
    if (!up && s.startedAt) up = Math.floor((Date.now()-s.startedAt)/1000);
    el('uptime').textContent = fmtHMS(up);

    // Лайков до ближайшего like-майлстоуна рулетки.
    const likes = s.currentTotalLikes || 0;
    let best = null, bestName = '';
    ((cfg && cfg.roulettes) || []).forEach(r => {
      if (!r.isEnabled || (r.triggerType !== 'like' && r.triggerType !== 'both')) return;
      const th = r.likesThreshold || 0;
      if (th <= 0) return;
      const left = th - (likes % th || th);
      if (best === null || left < best) { best = left; bestName = r.name || ''; }
    });
    const lbl = (cfg && cfg.styles && cfg.styles.statsLikesLabel) || 'ДО РУЛЕТКИ';
    el('nextK').textContent = bestName ? lbl + ' · ' + bestName : lbl;
    el('next').textContent = best !== null ? fmtK(best) + ' ❤' : '—';

    // Детект прироста лайков → дождь сердечек.
    if (lastLikes >= 0 && likes > lastLikes){
      spawnHearts(Math.min(14, Math.max(2, Math.round((likes-lastLikes)/8)+2)));
    }
    lastLikes = likes;
  }
  setInterval(render, 500);

  // Розовые сердечки падают по краям виджета, не закрывая цифры.
  function spawnHearts(n){
    const box = el('hearts');
    for (let i=0;i<n;i++){
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = ['💗','💖','💕','💘','🩷'][Math.floor(Math.random()*5)];
      const side = Math.random()<0.5;
      h.style.left = (side ? 2+Math.random()*22 : 76+Math.random()*22) + '%';
      h.style.setProperty('--hs', (18+Math.random()*22)+'px');
      h.style.setProperty('--hd', (2.6+Math.random()*2)+'s');
      h.style.setProperty('--hy', (innerHeight*(0.45+Math.random()*0.3))+'px');
      h.style.setProperty('--hx', ((Math.random()*40-20))+'px');
      h.style.setProperty('--hr', ((Math.random()*30-15))+'deg');
      h.style.animationDelay = (Math.random()*0.7)+'s';
      box.appendChild(h);
      setTimeout(()=>h.remove(), 5600);
    }
  }

  function applyStyles(c){
    cfg = c || cfg;
    const st = (cfg && cfg.styles) || {};
    stage.style.setProperty('--rp', st.roulettePrimary || '#6366f1');
    stage.style.setProperty('--rp2', st.rouletteSecondary || '#f59e0b');
    stage.style.setProperty('--rs', st.rouletteSurface || '#111827');
    stage.style.setProperty('--rt', st.rouletteText || '#ffffff');
    if (st.fontFamily) stage.style.fontFamily = st.fontFamily;
    stage.classList.toggle('transparent', !!st.statsTransparent);
    if (st.statsUptimeLabel) el('uptimeK').textContent = st.statsUptimeLabel;
  }

  function onFrame(v){
    if (v.type === 'snapshot'){ state = v.state || state; applyStyles(v.cfg); render(); }
    else if (v.type === 'settings'){ applyStyles(v.cfg); render(); }
    else if (v.type === 'tick'){ state = v.state || state; render(); }
  }

  // ---- tauri window chrome ----
  if (window.__TAURI__){
    const tb = document.getElementById('tb');
    tb.style.display = 'flex';
    tb.setAttribute('data-tauri-drag-region','');
    tb.addEventListener('mousedown', (e)=>{
      if (e.target.id === 'tbClose') return;
      try { window.__TAURI__.window.getCurrentWindow().startDragging(); } catch(_){}
    });
    document.getElementById('tbClose').onclick = () =>
      window.__TAURI__.window.getCurrentWindow().close();
  }

  if (demo){
    cfg = { uptimeStartTime: new Date(Date.now()-3723000).toISOString(),
            roulettes:[{isEnabled:true,triggerType:'like',likesThreshold:50000,name:'ЗА ЛАЙКИ'}],
            styles:{} };
    state = { currentTotalLikes: 12400 };
    spawnHearts(8);
    return;
  }
  let ws;
  function connect(){
    ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token)}`);
    ws.onopen = () => ws.send(JSON.stringify({ type:'subscribe', channels:['timer'] }));
    ws.onmessage = e => { try { onFrame(JSON.parse(e.data)); } catch(_){} };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();
})();
</script>
</body>
</html>
