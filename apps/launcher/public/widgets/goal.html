<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Stream Goal</title>
<style>
  :root{
    --fd:'Unbounded'; --fb:'Rubik';
    --a1:#a8e6ff; --a2:#d5a6ff; --a3:#ffd6f5;
    --ink:#f4faff; --mut:#9db8d6;
    --panel:linear-gradient(160deg, rgba(20,24,40,.9), rgba(8,10,18,.95));
    --line:rgba(184,200,255,.45); --glow:#a8e6ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
  .stage {
    position:absolute; left:50%; top:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    font-family:var(--fb), sans-serif; color:var(--ink);
  }
  .wrap { position:absolute; inset:0; padding:340px 70px 0; display:flex; flex-direction:column; align-items:center; }

  .label {
    font-family:var(--fd); font-size:74px; letter-spacing:4px; text-transform:uppercase;
    text-align:center; margin-bottom:70px;
  }
  .board {
    width:100%; background:var(--panel); border:3px solid var(--line);
    border-radius:44px; padding:64px 60px 70px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
  }
  .nums { display:flex; align-items:baseline; justify-content:center; gap:26px; margin-bottom:54px; }
  .cur { font-family:var(--fd); font-size:150px; line-height:1; color:var(--a1); }
  .sep { font-size:80px; color:var(--mut); }
  .tgt { font-family:var(--fd); font-size:80px; color:var(--mut); }

  .bar { position:relative; height:96px; border-radius:48px; background:rgba(0,0,0,.5);
    border:3px solid var(--line); overflow:hidden; }
  .fill {
    position:absolute; inset:0; width:0%; border-radius:48px;
    background:linear-gradient(90deg, var(--a2), var(--a1));
    box-shadow:0 0 40px var(--glow);
    transition:width .6s cubic-bezier(.22,1,.36,1);
  }
  .fill::after{ content:''; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,transparent 45%,rgba(0,0,0,.25) 100%); }
  .pct {
    margin-top:34px; text-align:center;
    font-family:var(--fd); font-size:54px; color:var(--a3); letter-spacing:3px;
  }
  .done { animation:pop .5s ease; }
  @keyframes pop { 0%{transform:scale(.6)} 60%{transform:scale(1.12)} 100%{transform:scale(1)} }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="wrap">
    <div class="label fx-text" id="label">ЦЕЛЬ СТРИМА</div>
    <div class="board">
      <div class="nums">
        <span class="cur fx-text" id="cur">0</span>
        <span class="sep">/</span>
        <span class="tgt" id="tgt">0</span>
      </div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="pct" id="pct">0%</div>
    </div>
  </div>
</div>
<script src="bridge.js"></script>
<script src="themes.js"></script>
<script>
  TTW.apply('holo');
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const q = new URLSearchParams(location.search);
  const metric = q.get('metric') || 'likes';          // likes | gifts | coins
  const GOAL = Math.max(1, parseInt(q.get('goal'), 10) || 1000);
  const LABELS = { likes:'ЦЕЛЬ ПО ЛАЙКАМ', gifts:'ЦЕЛЬ ПО ПОДАРКАМ', coins:'ЦЕЛЬ ПО МОНЕТАМ' };
  const $ = id => document.getElementById(id);
  $('label').textContent = q.get('label') || LABELS[metric] || LABELS.likes;
  $('tgt').textContent = GOAL.toLocaleString('ru-RU');
  const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(Math.floor(n));

  let wasDone = false;
  io().on('state', s => {
    const t = s.totals || { likes: s.likes?.total || 0, gifts: s.room?.giftsCount || 0,
      coins: (s.gifts?.top || []).reduce((a, u) => a + (u.coins || 0), 0) };
    const v = t[metric] || 0;
    const p = Math.min(100, v / GOAL * 100);
    $('cur').textContent = fmt(v);
    $('fill').style.width = p + '%';
    $('pct').textContent = Math.floor(p) + '%';
    const done = v >= GOAL;
    if (done && !wasDone) { $('pct').classList.add('done'); $('pct').textContent = 'ЦЕЛЬ ДОСТИГНУТА!'; }
    if (!done) { $('pct').classList.remove('done'); }
    wasDone = done;
  });
</script>
</body>
</html>
