<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Events Feed Widget</title>
<style>
  :root{
    --fd:'Anton'; --fb:'Space Grotesk';
    --a1:#eef2f6; --a2:#8d969f; --a3:#ffffff;
    --ink:#f2f5f8; --mut:#9aa4ad;
    --panel:linear-gradient(170deg, rgba(18,20,24,.92), rgba(6,7,9,.95));
    --line:rgba(220,228,236,.4); --glow:rgba(255,255,255,.35);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
  .stage {
    position:absolute; left:50%; top:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    font-family:var(--fb), sans-serif; color:var(--ink);
  }
  .ev-title {
    position:absolute; left:70px; top:190px;
    font-family:var(--fd); font-size:44px; letter-spacing:8px;
    color:var(--a1); text-transform:uppercase;
  }
  .ev-title small { display:block; font-family:var(--fb); font-size:22px; letter-spacing:10px; color:var(--mut); margin-top:6px; }
  .wrap {
    position:absolute; left:60px; right:60px; top:300px;
    display:flex; flex-direction:column; gap:18px;
    mask-image:linear-gradient(180deg, #000 78%, transparent);
    -webkit-mask-image:linear-gradient(180deg, #000 78%, transparent);
  }
  .ev {
    display:flex; align-items:center; gap:22px;
    padding:20px 30px;
    background:var(--panel);
    border:1.5px solid var(--line); border-radius:24px;
    box-shadow:0 14px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1);
    backdrop-filter:blur(8px);
    animation:evIn .5s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes evIn { 0%{opacity:0; transform:translateX(-70px) scale(.9)} 100%{opacity:1; transform:none} }
  .ev.old { opacity:.45; }
  .e-ic {
    width:82px; height:82px; flex:none; border-radius:22px;
    display:flex; align-items:center; justify-content:center;
    font-size:44px;
    background:color-mix(in srgb, var(--ec, var(--a1)) 18%, transparent);
    border:2px solid color-mix(in srgb, var(--ec, var(--a1)) 55%, transparent);
    box-shadow:0 0 18px color-mix(in srgb, var(--ec, var(--a1)) 30%, transparent);
  }
  .e-body { min-width:0; flex:1; }
  .e-nick { font-family:var(--fd); font-size:32px; letter-spacing:2px; color:var(--ec, var(--a1)); text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .e-text { font-size:28px; color:var(--mut); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .e-gift { width:70px; height:70px; object-fit:contain; flex:none; filter:drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
  .t-gift { --ec:#ffe14d; } .t-follow { --ec:#5ef2ff; } .t-share { --ec:#ff5fa2; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="ev-title fx-text">EVENTS<small>LIVE FEED</small></div>
  <div class="wrap" id="wrap"></div>
</div>
<script src="bridge.js"></script>
<script src="themes.js"></script>
<script>
  TTW.apply('chrome');
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const wrap = document.getElementById('wrap');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ICONS = { gift:'&#127873;', follow:'&#128153;', share:'&#8599;' };
  const TEXTS = {
    gift:   d => `отправил x${d.count} ${esc(d.giftName)}${d.coins ? ' · '+d.coins+' 💎' : ''}`,
    follow: () => 'подписался на эфир',
    share:  () => 'поделился трансляцией'
  };
  const MAX = 10;

  io().on('alert', d => {
    const el = document.createElement('div');
    el.className = 'ev t-' + d.type;
    el.innerHTML = `
      <div class="e-ic">${ICONS[d.type] || '&#11088;'}</div>
      <div class="e-body">
        <div class="e-nick">${esc(d.nickname||'???')}</div>
        <div class="e-text">${(TEXTS[d.type]||(()=> 'событие'))(d)}</div>
      </div>
      ${d.image ? `<img class="e-gift" src="${d.image}">` : ''}`;
    wrap.prepend(el);
    while (wrap.children.length > MAX) wrap.lastElementChild.remove();
    [...wrap.children].forEach((c,i) => c.classList.toggle('old', i > 4));
  });
</script>
</body>
</html>
