<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Countdown</title>
<style>
  :root{
    --fd:'Rubik Mono One'; --fb:'VT323';
    --a1:#ff2975; --a2:#00e5ff; --a3:#ffe74c;
    --ink:#f0f0f0; --mut:#8a8a9a;
    --panel:rgba(12,10,20,.9); --line:#ff2975; --glow:#ff2975;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
  .stage {
    position:absolute; left:50%; top:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    font-family:var(--fb), sans-serif; color:var(--ink);
  }
  .wrap { position:absolute; inset:0; padding:340px 70px 0; display:flex; flex-direction:column; align-items:center; }

  .label { font-size:44px; letter-spacing:14px; color:var(--mut); text-transform:uppercase; margin-bottom:60px; }
  .clock {
    font-family:var(--fd); font-size:230px; letter-spacing:6px;
    background:var(--panel); border:4px solid var(--line); border-radius:50px;
    padding:60px 70px;
    box-shadow:0 0 70px color-mix(in srgb, var(--glow) 35%, transparent),
               0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .clock.hot { animation:throb .8s ease-in-out infinite; }
  @keyframes throb { 0%,100%{transform:scale(1)} 50%{transform:scale(1.045)} }
  .sub { margin-top:56px; font-size:40px; color:var(--a1); letter-spacing:6px; text-transform:uppercase; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="wrap">
    <div class="label" id="label">до старта осталось</div>
    <div class="clock fx-text" id="clock">00:00</div>
    <div class="sub" id="sub"></div>
  </div>
</div>
<script src="bridge.js"></script>
<script src="themes.js"></script>
<script>
  TTW.apply('vhs');
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  if (q.get('label')) $('label').textContent = q.get('label');
  if (q.get('sub')) $('sub').textContent = q.get('sub');
  const endText = q.get('end') || 'ПОЕХАЛИ!';

  let left = Math.max(0, (parseInt(q.get('min'), 10) || 30) * 60 + (parseInt(q.get('sec'), 10) || 0));
  const pad = n => String(n).padStart(2, '0');

  function draw() {
    const m = Math.floor(left / 60), s = left % 60;
    $('clock').textContent = left <= 0 ? endText : `${pad(m)}:${pad(s)}`;
    $('clock').classList.toggle('hot', left > 0 && left <= 60);
    if (left > 0) { left--; setTimeout(draw, 1000); }
  }
  draw();
</script>
</body>
</html>
