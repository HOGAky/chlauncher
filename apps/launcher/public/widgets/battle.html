<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Gift Battle Widget</title>
<style>
  :root{
    --fd:'Bangers'; --fb:'Russo One';
    --a1:#ffe14d; --a2:#ff4757; --a3:#1e90ff;
    --ink:#fff; --mut:#ffe14d; --line:#141414;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
  .stage {
    position:absolute; left:50%; top:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    font-family:var(--fb), sans-serif; color:var(--ink);
  }
  .wrap { position:absolute; inset:0; padding:200px 40px 0; }

  .bt-title {
    text-align:center; font-family:var(--fd); font-size:96px;
    letter-spacing:6px; color:var(--a1); transform:rotate(-2deg);
    -webkit-text-stroke:4px var(--line);
    text-shadow:6px 6px 0 var(--line), 0 0 30px color-mix(in srgb, var(--a1) 40%, transparent);
  }
  .bt-title span { color:var(--a2); }

  .arena { position:relative; margin-top:50px; height:860px; }

  .side {
    position:absolute; top:0; width:500px; height:760px; padding:34px 26px;
    border:5px solid var(--line); overflow:hidden;
  }
  .side::before {
    content:''; position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,.28) 2.5px, transparent 2.5px);
    background-size:22px 22px; opacity:.5; pointer-events:none;
  }
  .side::after {
    content:''; position:absolute; inset:0; opacity:.18; pointer-events:none;
    background:repeating-linear-gradient(115deg, #fff 0 3px, transparent 3px 26px);
  }
  .blue {
    left:0; transform:skewY(-1.5deg);
    background:linear-gradient(160deg,#1e90ff,#0a3d91);
    border-radius:26px 8px 8px 26px;
    box-shadow:-10px 12px 0 rgba(0,0,0,.45);
  }
  .red {
    right:0; transform:skewY(1.5deg);
    background:linear-gradient(200deg,#ff4757,#8b0000);
    border-radius:8px 26px 26px 8px;
    box-shadow:10px 12px 0 rgba(0,0,0,.45);
  }
  .team-tag {
    font-family:var(--fd); font-size:44px; letter-spacing:3px; text-align:center;
    -webkit-text-stroke:2.5px var(--line); text-shadow:4px 4px 0 var(--line);
    position:relative; z-index:2;
  }
  .gift-slot {
    position:relative; z-index:2; margin:36px auto 0; width:330px; height:330px;
    background:rgba(255,255,255,.14); border:5px dashed rgba(255,255,255,.75);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 40px rgba(0,0,0,.35);
  }
  .gift-slot img { width:230px; height:230px; object-fit:contain; filter:drop-shadow(6px 8px 0 rgba(0,0,0,.4)); animation:hover 2.4s ease-in-out infinite; }
  .gift-name {
    position:relative; z-index:2; margin-top:26px; text-align:center;
    font-family:var(--fd); font-size:52px; letter-spacing:2px;
    -webkit-text-stroke:2px var(--line); text-shadow:4px 4px 0 var(--line);
    min-height:60px;
  }
  .count {
    position:relative; z-index:2; text-align:center; margin-top:10px;
    font-family:var(--fd); font-size:120px; line-height:1;
    -webkit-text-stroke:5px var(--line); text-shadow:7px 7px 0 var(--line);
  }
  .count small { font-size:54px; }
  .donor {
    position:relative; z-index:2; margin:26px auto 0; max-width:420px;
    background:var(--line); color:var(--a1); border-radius:14px; padding:12px 20px;
    font-size:26px; text-align:center; transform:rotate(-1.5deg);
    box-shadow:5px 5px 0 rgba(0,0,0,.35);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-family:var(--fb);
  }
  .red .donor { transform:rotate(1.5deg); }

  .vs {
    position:absolute; left:50%; top:300px; transform:translate(-50%,-50%);
    z-index:5; width:300px; height:300px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--fd); font-size:150px; color:#fff;
    -webkit-text-stroke:6px var(--line);
    background:
      radial-gradient(circle at 50% 45%, var(--a1) 0 38%, #ff9f1a 60%, #e25822 100%);
    clip-path:polygon(50% 0%,61% 12%,76% 5%,80% 21%,97% 20%,93% 37%,100% 50%,93% 63%,97% 80%,80% 79%,76% 95%,61% 88%,50% 100%,39% 88%,24% 95%,20% 79%,3% 80%,7% 63%,0% 50%,7% 37%,3% 20%,20% 21%,24% 5%,39% 12%);
    animation:vsPulse 1.1s ease-in-out infinite;
    text-shadow:6px 6px 0 var(--line);
  }
  .bolt { position:absolute; font-family:var(--fd); color:var(--a1); z-index:4; font-size:90px;
    -webkit-text-stroke:3px var(--line); text-shadow:4px 4px 0 var(--line); }
  .bolt.b1 { left:435px; top:120px; transform:rotate(-24deg); animation:zap .9s steps(2) infinite; }
  .bolt.b2 { left:560px; top:560px; transform:rotate(18deg) scaleX(-1); animation:zap 1.3s steps(2) infinite; }

  .pow { position:absolute; z-index:6; font-family:var(--fd); font-size:56px; color:#fff;
    -webkit-text-stroke:3px var(--line); text-shadow:4px 4px 0 var(--line); }
  .pow.p1 { left:30px; top:620px; transform:rotate(-14deg); color:#7ee9ff; }
  .pow.p2 { right:30px; top:90px; transform:rotate(12deg); color:#ffb8c1; }

  .tug { margin-top:60px; position:relative; }
  .tug-label { display:flex; justify-content:space-between; font-family:var(--fd); font-size:38px; letter-spacing:3px; margin-bottom:12px; -webkit-text-stroke:2px var(--line); text-shadow:3px 3px 0 var(--line); }
  .tug-track {
    height:70px; border:5px solid var(--line); border-radius:40px; overflow:hidden;
    background:var(--line); box-shadow:8px 8px 0 rgba(0,0,0,.4);
    display:flex;
  }
  .tug-a { height:100%; width:50%; background:repeating-linear-gradient(-55deg,#1e90ff 0 26px,#0a6dd8 26px 52px); transition:width .5s cubic-bezier(.3,1.4,.4,1); }
  .tug-b { height:100%; width:50%; background:repeating-linear-gradient(55deg,#ff4757 0 26px,#c62828 26px 52px); transition:width .5s cubic-bezier(.3,1.4,.4,1); }
  .tug-flag {
    position:absolute; left:50%; top:-18px; transform:translateX(-50%);
    background:var(--a1); color:var(--line); border:4px solid var(--line); border-radius:12px;
    font-family:var(--fd); font-size:30px; padding:2px 18px; letter-spacing:2px;
    transition:left .5s cubic-bezier(.3,1.4,.4,1); z-index:3;
  }

  @keyframes hover { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
  @keyframes vsPulse { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.07)} }
  @keyframes zap { 0%,100%{opacity:1} 50%{opacity:.25} }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="wrap">
    <div class="bt-title fx-text" id="hTitle">GIFT <span>BATTLE</span></div>

    <div class="arena">
      <div class="side blue">
        <div class="team-tag">TEAM BLUE</div>
        <div class="gift-slot"><img id="imgA" src="" alt="" onerror="this.style.opacity=0"></div>
        <div class="gift-name" id="nameA">?</div>
        <div class="count"><small>x</small><span id="cntA">0</span></div>
        <div class="donor" id="donorA">TOP: —</div>
      </div>

      <div class="pow p1">POW!</div>
      <div class="pow p2">BAM!</div>
      <div class="bolt b1">&#9889;</div>
      <div class="bolt b2">&#9889;</div>
      <div class="vs">VS</div>

      <div class="side red">
        <div class="team-tag">TEAM RED</div>
        <div class="gift-slot"><img id="imgB" src="" alt="" onerror="this.style.opacity=0"></div>
        <div class="gift-name" id="nameB">?</div>
        <div class="count"><small>x</small><span id="cntB">0</span></div>
        <div class="donor" id="donorB">TOP: —</div>
      </div>
    </div>

    <div class="tug">
      <div class="tug-label"><span id="lblA">BLUE</span><span id="lblB">RED</span></div>
      <div class="tug-track">
        <div class="tug-a" id="tugA"></div>
        <div class="tug-b" id="tugB"></div>
      </div>
      <div class="tug-flag" id="flag">&#9873;</div>
    </div>
  </div>
</div>
<script src="bridge.js"></script>
<script src="themes.js"></script>
<script>
  TTW.apply('comic');
  const _q = new URLSearchParams(location.search);
  if (_q.get('title')) {
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const parts = _q.get('title').split('|');
    document.getElementById('hTitle').innerHTML =
      parts.length > 1 ? `${esc(parts[0])} <span>${esc(parts.slice(1).join(' '))}</span>` : esc(parts[0]);
  }
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const $ = id => document.getElementById(id);
  const socket = io();

  socket.on('state', s => {
    const b = s.battle;
    $('nameA').textContent = b.giftA; $('nameB').textContent = b.giftB;
    $('lblA').textContent = b.giftA.toUpperCase(); $('lblB').textContent = b.giftB.toUpperCase();
    if (b.imageA) { $('imgA').src = b.imageA; $('imgA').style.opacity = 1; }
    if (b.imageB) { $('imgB').src = b.imageB; $('imgB').style.opacity = 1; }
    $('cntA').textContent = b.a; $('cntB').textContent = b.b;
    $('donorA').textContent = 'TOP: ' + (b.topA ? b.topA.nickname + ' x' + b.topA.count : '—');
    $('donorB').textContent = 'TOP: ' + (b.topB ? b.topB.nickname + ' x' + b.topB.count : '—');

    const total = b.a + b.b;
    const pct = total === 0 ? 50 : Math.max(8, Math.min(92, b.a/total*100));
    $('tugA').style.width = pct+'%';
    $('tugB').style.width = (100-pct)+'%';
    $('flag').style.left = pct+'%';
  });
</script>
</body>
</html>
