<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>chlauncher · progress</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
  }
  #bars { position: absolute; left: 12px; bottom: 12px; width: 260px;
          display: flex; flex-direction: column; gap: 8px; }
  .bar { background: rgba(15,17,26,.85); border: 1px solid rgba(255,255,255,.1);
         border-radius: 10px; padding: 7px 12px; }
  .bar .head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .bar .track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar .fill { height: 100%; background: linear-gradient(90deg,#7c3aed,#db2777);
               border-radius: 3px; transition: width .3s ease; }
</style>
</head>
<body>
<div id="bars"></div>
<script>
const token = new URLSearchParams(location.search).get('t') || '';
const bars = document.getElementById('bars');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(items) {
  bars.innerHTML = (items || []).map(it => {
    const pct = it.target > 0 ? Math.min(100, Math.round(it.value / it.target * 100)) : 0;
    return `<div class="bar"><div class="head"><span>${esc(it.label)}</span>` +
           `<b>${it.value}/${it.target}</b></div>` +
           `<div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token)}`);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'subscribe', channels: ['progress'] }));
  ws.onmessage = (m) => {
    try { const f = JSON.parse(m.data); if (f.type === 'progress') render(f.items); } catch (e) {}
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
