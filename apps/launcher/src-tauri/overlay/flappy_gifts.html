<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Flappy Gifts</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .hud{position:fixed;top:10px;right:10px}.dot{width:10px;height:10px;border-radius:50%;background:#3f8}
  .dot[data-s=reconnecting]{background:#f80}
  #score{position:fixed;top:14px;left:50%;transform:translateX(-50%);font:800 34px/1 monospace;text-shadow:0 2px 8px #000}
  #info{position:fixed;top:14px;left:18px;font:700 16px/1.4 monospace;text-shadow:0 2px 6px #000}
  .feed{position:fixed;left:12px;bottom:12px;font:13px/1.5 monospace;text-shadow:0 1px 4px #000;opacity:.9}
  .banners{position:fixed;top:26%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  .banner{font:800 38px/1.2 system-ui;text-shadow:0 3px 14px #000;animation:pop .3s}
  .banner.big{color:#ffd34d}.banner.bad{color:#ff6b6b}
  #board{position:fixed;top:56px;right:12px;font:12px/1.6 monospace;text-align:right;text-shadow:0 1px 4px #000;opacity:.85}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  #pause{position:fixed;inset:0;display:none;place-items:center;font:800 46px/1 system-ui;background:rgba(0,0,0,.5);text-shadow:0 3px 10px #000}
</style></head><body>
<canvas id="cv"></canvas>
<div id="score">0</div><div id="info"></div>
<div id="board"></div><div id="pause">ПАУЗА</div>
<script>
'use strict';
// Flappy Gifts — птица летит на автопилоте через трубы; подарки дают
// буст вверх, щит от столкновения, бонусные очки и "шторм" узких труб.
// Врезалась без щита → респавн с потерей части очков.
const BG = new URLSearchParams(location.search).get('bg');
if (BG) document.body.style.background = '#' + BG;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let HUD = null;
const GAME = 'flappy_gifts';

const S = {
  cfg: null, eng: null, running: true,
  bird: { y: 0, vy: 0, x: 0.22 },
  pipes: [], score: 0, best: 0, deaths: 0,
  gap: 0.32, gapShrinkUntil: 0, shieldUntil: 0, boostQ: 0,
  nextPipeX: 1, supporters: {}, stats: { events: 0, gifts: 0, coins: 0 },
};

const GRAV = 2200, FLAP = -640, PIPE_W = 0.075, PIPE_SPEED = 0.32;

function respawn() {
  S.deaths++;
  S.best = Math.max(S.best, S.score);
  S.score = Math.max(0, S.score - 5);
  S.bird.y = 0.5; S.bird.vy = 0;
  S.pipes = []; S.nextPipeX = 1.2;
  HUD.banners.push('ПТИЦА РАЗБИЛАСЬ!', 'bad');
  GameKit.sfx('warn', S.cfg.volume);
}

function spawnPipe(x) {
  const margin = 0.12;
  const gap = Date.now() < S.gapShrinkUntil ? S.gap * 0.62 : S.gap;
  const top = margin + Math.random() * (1 - 2 * margin - gap);
  S.pipes.push({ x, top, gap, scored: false });
}

function flap() { S.bird.vy = FLAP; GameKit.sfx('add', S.cfg.volume * 0.5); }

function act(a) {
  if (a.per) a = { ...a, value: Math.max(1, Math.round((a.value || 1) * (a._count || 1) / a.per)) };
  if (a.per_coin) a = { ...a, value: Math.max(1, Math.round((a.value || 1) * (a._coins || 1) * a.per_coin)) };
  const u = a._user || '?';
  S.supporters[u] = (S.supporters[u] || 0) + 1;
  switch (a.type) {
    case 'boost': {
      for (let i = 0; i < (a.value || 1); i++) S.boostQ++;
      HUD.feed.push(`${u}: буст ×${a.value || 1}`);
      break;
    }
    case 'shield': {
      S.shieldUntil = Date.now() + (a.sec || 10) * 1000;
      HUD.banners.push('ЩИТ АКТИВЕН!', 'big');
      break;
    }
    case 'score': {
      S.score += a.value || 1;
      HUD.feed.push(`${u}: +${a.value || 1} очков`);
      GameKit.sfx('coin', S.cfg.volume);
      break;
    }
    case 'storm': {
      S.gapShrinkUntil = Date.now() + (a.sec || 12) * 1000;
      HUD.banners.push('УЗКИЕ ТРУБЫ!', 'bad');
      GameKit.sfx('big', S.cfg.volume);
      break;
    }
    case 'wide': {
      for (const p of S.pipes) p.gap = Math.min(0.6, p.gap + 0.06);
      S.gap = Math.min(0.5, S.gap + 0.02);
      HUD.feed.push(`${u}: трубы шире`);
      break;
    }
  }
}

function step(dt) {
  if (!S.running) return;
  for (const a of S.eng.pump()) act(a);
  // autopilot: flap when below the middle of the next gap
  const next = S.pipes.find((p) => p.x + PIPE_W > S.bird.x);
  const target = next ? next.top + next.gap / 2 : 0.5;
  if (S.boostQ > 0) { S.boostQ--; flap(); }
  else if (S.bird.y > target + 0.015 && S.bird.vy > -80) flap();
  S.bird.vy += GRAV * dt;
  S.bird.y += (S.bird.vy / 1000) * dt * 60;
  S.bird.y = Math.max(0.02, Math.min(0.98, S.bird.y));

  S.nextPipeX -= PIPE_SPEED * dt;
  if (S.nextPipeX <= 0.82) { spawnPipe(1); S.nextPipeX = 0.30 + Math.random() * 0.1; }
  for (const p of S.pipes) p.x -= PIPE_SPEED * dt;
  S.pipes = S.pipes.filter((p) => p.x > -PIPE_W - 0.05);

  const by = S.bird.y, bx = S.bird.x, br = 0.028;
  for (const p of S.pipes) {
    if (!p.scored && p.x + PIPE_W < bx) {
      p.scored = true; S.score++;
      GameKit.sfx('coin', S.cfg.volume * 0.4);
    }
    const inX = bx + br > p.x && bx - br < p.x + PIPE_W;
    const inGap = by - br > p.top && by + br < p.top + p.gap;
    if (inX && !inGap) {
      if (Date.now() < S.shieldUntil) {
        S.pipes = S.pipes.filter((q) => q !== p);
        HUD.banners.push('ЩИТ СПАС!', 'big');
        GameKit.sfx('hit', S.cfg.volume);
      } else { respawn(); return; }
    }
  }
  if (by >= 0.98) respawn();
}

function draw() {
  cv.width = cv.clientWidth; cv.height = cv.clientHeight;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const W = cv.width, H = cv.height;
  // pipes
  for (const p of S.pipes) {
    const px = p.x * W, pw = PIPE_W * W;
    const storm = Date.now() < S.gapShrinkUntil;
    ctx.fillStyle = storm ? 'hsl(340 70% 55% / .9)' : 'hsl(120 60% 45% / .9)';
    ctx.fillRect(px, 0, pw, p.top * H);
    ctx.fillRect(px, (p.top + p.gap) * H, pw, (1 - p.top - p.gap) * H);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(px, p.top * H - 6, pw, 6);
    ctx.fillRect(px, (p.top + p.gap) * H, pw, 6);
  }
  // shield ring
  const shielded = Date.now() < S.shieldUntil;
  const bx = S.bird.x * W, by = S.bird.y * H;
  if (shielded) {
    ctx.strokeStyle = 'rgba(120,200,255,.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bx, by, 30, 0, Math.PI * 2); ctx.stroke();
  }
  // bird
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(Math.max(-0.5, Math.min(0.6, S.bird.vy / 1400)));
  ctx.fillStyle = '#ffd34d';
  ctx.beginPath(); ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff9f43';
  ctx.beginPath(); ctx.ellipse(-4, 2, 10, 6, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(6, -4, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(7, -4, 2, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff7043';
  ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(22, 3); ctx.lineTo(14, 6); ctx.fill();
  ctx.restore();
  document.getElementById('score').textContent = `★ ${S.score}`;
  document.getElementById('info').textContent =
    `ПОПЫТКА ${S.deaths + 1} · РЕКОРД ${S.best}` + (shielded ? ' · 🛡' : '');
  document.getElementById('board').innerHTML =
    GameKit.leaderboard(S.supporters, 5).map((r, i) => `${i + 1}. ${r.user} — ${r.score}`).join('<br>');
}

async function main() {
  HUD = GameKit.hud();
  const { cfg } = await GameKit.fetchCfg(GAME);
  S.cfg = cfg;
  S.eng = new GameKit.Engine(cfg);
  S.bird.y = 0.5;
  spawnPipe(1.2); S.nextPipeX = 1.6;
  GameKit.connect(['game'], (ev) => {
    if (ev.event_kind === 'gift') { S.stats.gifts++; S.stats.coins += ev.coins || 0; }
    S.eng.feed(ev);
  }, (s) => HUD.setStatus(s));
  GameKit.watchSession(GAME, (status) => {
    document.getElementById('pause').style.display = status === 'paused' ? 'grid' : 'none';
    S.running = status === 'running';
  });
  GameKit.unloadReport(GAME, () => {
    if (!S.cfg) return null;
    return {
      duration_s: 0,
      winner: `score ${S.score}`,
      score: { score: S.score, best: S.best, deaths: S.deaths },
      top: GameKit.leaderboard(S.supporters, 5),
      stats: S.stats,
    };
  });
  HUD.banners.push('FLAPPY GIFTS — держим птицу в небе!', 'big');
  GameKit.loop(step, draw);
}
{
  const s = document.createElement('script');
  s.src = '/gamekit.js?t=' + encodeURIComponent(new URLSearchParams(location.search).get('t') || '');
  s.onload = () => main().catch((e) => {
    document.body.innerHTML = `<pre style="color:#f66;padding:20px">${e}</pre>`;
  });
  s.onerror = () => { document.body.innerHTML = '<pre style="color:#f66;padding:20px">gamekit: 403 — проверьте токен</pre>'; };
  document.head.appendChild(s);
}
</script></body></html>
