<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Survive the Horde</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .hud{position:fixed;top:10px;right:10px}.dot{width:10px;height:10px;border-radius:50%;background:#3f8}
  .dot[data-s=reconnecting]{background:#f80}
  #timer{position:fixed;top:14px;left:50%;transform:translateX(-50%);font:700 30px/1 monospace;text-shadow:0 2px 8px #000}
  #hp{position:fixed;top:16px;left:16px;font:700 16px/1.4 monospace;text-shadow:0 2px 6px #000}
  #hpbar{width:180px;height:14px;border:2px solid #fff;border-radius:4px;overflow:hidden}
  #hpfill{height:100%;background:#4f4;transition:width .2s}
  #mods{position:fixed;top:80px;left:16px;font:12px/1.6 monospace;text-shadow:0 1px 4px #000;opacity:.85}
  #board{position:fixed;top:60px;right:12px;font:12px/1.6 monospace;text-align:right;text-shadow:0 1px 4px #000;opacity:.85}
  .feed{position:fixed;left:12px;bottom:12px;font:13px/1.5 monospace;text-shadow:0 1px 4px #000;opacity:.9}
  .banners{position:fixed;top:22%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  .banner{font:800 38px/1.2 system-ui;text-shadow:0 3px 14px #000;animation:pop .3s}
  .banner.big{color:#ffd34d}.banner.destroy{color:#ff6b6b}
  #hint{position:fixed;bottom:12px;right:14px;font:12px/1.5 monospace;opacity:.6;text-align:right}
  #over{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:rgba(0,0,0,.55)}
  #over h1{font:900 52px/1.1 system-ui;color:#ff6b6b;text-shadow:0 4px 16px #000}
  #over p{font:600 18px/1.5 system-ui}
  #pause{position:fixed;inset:0;display:none;place-items:center;font:800 46px/1 system-ui;background:rgba(0,0,0,.5)}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="timer">05:00</div>
<div id="hp">HP<div id="hpbar"><div id="hpfill" style="width:100%"></div></div><div id="score">0 очков</div></div>
<div id="mods"></div><div id="board"></div>
<div id="hint">WASD / стрелки — движение<br>автоатака по ближайшему</div>
<div id="over"><div><h1>GAME OVER</h1><p id="overinfo"></p><p>Стример может перезапустить из лаунчера</p></div></div>
<div id="pause">ПАУЗА</div>
<script>
'use strict';
// --- Survive the Horde: streamer dodges enemy waves (WASD), viewers
//     spawn enemies/effects via gifts, chat heals/buffs on cooldowns. ---
const BG = new URLSearchParams(location.search).get('bg');
if (BG) document.body.style.background = '#' + BG;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let HUD = null;
const GAME = 'survive_horde';
const TIER = {
  weak:     { hp: 20, speed: 55, r: 10, col: '#8f8', dmg: 8, score: 10 },
  fast:     { hp: 12, speed: 110, r: 8,  col: '#ff4', dmg: 6, score: 15 },
  miniboss: { hp: 120, speed: 40, r: 20, col: '#f80', dmg: 20, score: 100 },
  boss:     { hp: 400, speed: 32, r: 30, col: '#f40', dmg: 35, score: 500 },
};
const WEAPONS = {
  pistol:  { rate: 0.45, dmg: 12, speed: 420, name: 'Пистолет' },
  shotgun: { rate: 0.9,  dmg: 8,  speed: 360, spread: 5, name: 'Дробовик' },
  smg:     { rate: 0.15, dmg: 6,  speed: 460, name: 'ПП' },
  cannon:  { rate: 1.4,  dmg: 45, speed: 300, splash: 40, name: 'Пушка' },
};

const S = {
  cfg: null, eng: null, running: true, over: false,
  player: { x: 0, y: 0, hp: 100, max: 100, speed: 230, weapon: 'pistol', cd: 0 },
  enemies: [], bullets: [], meteors: [], particles: [],
  mods: [],                       // {label, until}
  keys: {}, waveT: 0, wave: 0, roundLeft: 0, score: 0,
  supporters: {}, stats: { events: 0, gifts: 0, coins: 0, kills: 0 },
};

const hasMod = (id) => S.mods.some((m) => m.id === id && m.until > Date.now());
function addMod(id, label, sec) {
  const until = Date.now() + sec * 1000;
  const cur = S.mods.find((m) => m.id === id);
  if (cur) { cur.until = Math.max(cur.until, until); cur.label = label; }
  else S.mods.push({ id, label, until });
}

function spawnEnemy(tier, edge) {
  const T = TIER[tier] || TIER.weak;
  const a = edge ?? Math.random() * Math.PI * 2;
  const dist = Math.max(cv.width, cv.height) * 0.6;
  S.enemies.push({
    x: cv.width / 2 + Math.cos(a) * dist,
    y: cv.height / 2 + Math.sin(a) * dist,
    ...T, max: T.hp,
  });
}
function wave() {
  S.wave++;
  const n = Math.min(40, 4 + S.wave * 2);
  for (let i = 0; i < n; i++) spawnEnemy(Math.random() < 0.15 ? 'fast' : 'weak');
  HUD.feed.push(`волна ${S.wave}: ${n} врагов`);
}
function meteor(user) {
  HUD.banners.push(`☄️ @${user} вызывает метеоритный дождь!`, 'destroy');
  GameKit.sfx('big', S.cfg.volume);
  for (let i = 0; i < 7; i++) {
    S.meteors.push({
      x: Math.random() * cv.width, y: -60 - i * 90,
      r: 60 + Math.random() * 40, t: 0.9 + i * 0.12,
    });
  }
}
function particle(x, y, col, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = 40 + Math.random() * 120;
    S.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, col });
  }
}

function applyAction(a) {
  const u = a._user || 'anon';
  switch (a.type) {
    case 'spawn_enemy': {
      const n = a.count || 1;
      for (let i = 0; i < n; i++) spawnEnemy(a.tier || 'weak');
      S.supporters[u] = (S.supporters[u] || 0) + (a._coins || 0);
      HUD.feed.push(`@${u}: +${n} × ${a.tier || 'weak'}`);
      GameKit.sfx('warn', S.cfg.volume);
      break;
    }
    case 'meteor': meteor(u); S.supporters[u] = (S.supporters[u] || 0) + (a._coins || 0); break;
    case 'random_buff': {
      const rolls = [
        () => addMod('speed', '⚡ +скорость', 10),
        () => addMod('dmg', '💥 +урон ×2', 10),
        () => { S.player.hp = Math.min(S.player.max, S.player.hp + 10); },
      ];
      rolls[Math.floor(Math.random() * rolls.length)]();
      break;
    }
    case 'heal': {
      S.player.hp = Math.min(S.player.max, S.player.hp + (a.value || 25));
      HUD.feed.push(`@${u}: +${a.value || 25} HP`);
      GameKit.sfx('coin', S.cfg.volume);
      break;
    }
    case 'weapon': {
      const keys = Object.keys(WEAPONS).filter((k) => k !== S.player.weapon);
      S.player.weapon = keys[Math.floor(Math.random() * keys.length)];
      addMod('weapon', `🔫 ${WEAPONS[S.player.weapon].name}`, 20);
      HUD.feed.push(`@${u} дарит ${WEAPONS[S.player.weapon].name} на 20 сек`);
      GameKit.sfx('coin', S.cfg.volume);
      break;
    }
    case 'shield': addMod('shield', `🛡 щит ${a.sec || 10}с`, a.sec || 10); break;
    case 'slow': addMod('slow', `🐌 враги медленнее ${a.sec || 10}с`, a.sec || 10); break;
  }
  S.stats.events++;
}

function gameOver() {
  if (S.over) return;
  S.over = true; S.running = false;
  document.getElementById('over').style.display = 'grid';
  document.getElementById('overinfo').textContent =
    `Очки: ${S.score} · волн: ${S.wave} · убийств: ${S.stats.kills} · время: ${GameKit.fmtTime((S.cfg.round_sec - S.roundLeft))}`;
  GameKit.sfx('hit', S.cfg.volume);
  GameKit.report({
    game_id: GAME, ended_at: new Date().toISOString(),
    duration_s: Math.round(S.cfg.round_sec - S.roundLeft),
    winner: `score ${S.score}`,
    score: S.score, wave: S.wave,
    top: GameKit.leaderboard(S.supporters, 5),
    stats: S.stats,
  });
}
function winRound() {
  if (S.over) return;
  S.over = true; S.running = false;
  HUD.banners.push(`🏆 ВЫЖИЛ! Очки: ${S.score}`, 'big');
  GameKit.sfx('win', S.cfg.volume);
  GameKit.report({
    game_id: GAME, ended_at: new Date().toISOString(),
    duration_s: S.cfg.round_sec, winner: 'survived',
    score: S.score, wave: S.wave,
    top: GameKit.leaderboard(S.supporters, 5),
    stats: S.stats,
  });
}

function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();
addEventListener('keydown', (e) => { S.keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', (e) => { S.keys[e.key.toLowerCase()] = false; });

function step(dt) {
  if (!S.running) return;
  for (const a of S.eng.pump()) applyAction(a);
  S.roundLeft -= dt; S.waveT -= dt;
  if (S.waveT <= 0) { wave(); S.waveT = Math.max(8, 20 - S.wave); }
  if (S.roundLeft <= 0) return winRound();

  const P = S.player;
  const spd = P.speed * (hasMod('speed') ? 1.5 : 1);
  const dx = (S.keys['d'] || S.keys['arrowright'] ? 1 : 0) - (S.keys['a'] || S.keys['arrowleft'] ? 1 : 0);
  const dy = (S.keys['s'] || S.keys['arrowdown'] ? 1 : 0) - (S.keys['w'] || S.keys['arrowup'] ? 1 : 0);
  const L = Math.hypot(dx, dy) || 1;
  P.x = Math.max(20, Math.min(cv.width - 20, P.x + (dx / L) * spd * dt));
  P.y = Math.max(20, Math.min(cv.height - 20, P.y + (dy / L) * spd * dt));

  // auto-attack nearest enemy
  P.cd -= dt;
  const w = WEAPONS[P.weapon];
  if (P.cd <= 0 && S.enemies.length) {
    let best = null, bd = 1e9;
    for (const e of S.enemies) {
      const d = Math.hypot(e.x - P.x, e.y - P.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (best) {
      const shots = w.spread || 1;
      for (let i = 0; i < shots; i++) {
        const a = Math.atan2(best.y - P.y, best.x - P.x) + (Math.random() - 0.5) * 0.25 * shots;
        S.bullets.push({ x: P.x, y: P.y, vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed, dmg: w.dmg * (hasMod('dmg') ? 2 : 1), splash: w.splash || 0, life: 1.2 });
      }
      P.cd = w.rate;
    }
  }
  // bullets
  for (const b of S.bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }
  S.bullets = S.bullets.filter((b) => b.life > 0 && b.x > -20 && b.x < cv.width + 20 && b.y > -20 && b.y < cv.height + 20);
  // hits
  const slowMul = hasMod('slow') ? 0.45 : 1;
  for (const e of S.enemies) {
    for (const b of S.bullets) {
      if (b.dmg > 0 && Math.hypot(e.x - b.x, e.y - b.y) < e.r + 4) {
        e.hp -= b.dmg; particle(b.x, b.y, '#ff6', 3); b.dmg = 0;
        if (b.splash) for (const e2 of S.enemies) if (e2 !== e && Math.hypot(e2.x - b.x, e2.y - b.y) < b.splash) e2.hp -= b.dmg * 0.5;
      }
    }
    // chase
    const d = Math.hypot(P.x - e.x, P.y - e.y) || 1;
    e.x += ((P.x - e.x) / d) * e.speed * slowMul * dt;
    e.y += ((P.y - e.y) / d) * e.speed * slowMul * dt;
    if (d < e.r + 12 && !hasMod('shield')) {
      P.hp -= e.dmg * dt;
      if (P.hp <= 0) { P.hp = 0; return gameOver(); }
    }
  }
  const before = S.enemies.length;
  S.enemies = S.enemies.filter((e) => {
    if (e.hp > 0) return true;
    S.score += e.score; S.stats.kills++;
    particle(e.x, e.y, e.col, 10);
    return false;
  });
  // meteors
  for (const m of S.meteors) {
    m.y += 400 * dt; m.t -= dt;
    if (m.t <= 0 && !m.done) {
      m.done = true;
      particle(m.x, m.y, '#f80', 16);
      for (const e of S.enemies) if (Math.hypot(e.x - m.x, e.y - m.y) < m.r) e.hp -= 200;
      if (Math.hypot(P.x - m.x, P.y - m.y) < m.r && !hasMod('shield')) P.hp -= 30;
    }
  }
  S.meteors = S.meteors.filter((m) => m.y < cv.height + 80);
  for (const p of S.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  S.particles = S.particles.filter((p) => p.life > 0);
  S.mods = S.mods.filter((m) => m.until > Date.now());
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  // meteors telegraphs
  for (const m of S.meteors) if (!m.done) {
    ctx.strokeStyle = 'rgba(255,120,0,.7)'; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.28); ctx.stroke();
    ctx.setLineDash([]);
  }
  // enemies
  for (const e of S.enemies) {
    ctx.fillStyle = e.col;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x - e.r, e.y - e.r - 7, e.r * 2 * Math.max(0, e.hp / e.max), 4);
  }
  // bullets
  ctx.fillStyle = '#ffe27d';
  for (const b of S.bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 6.28); ctx.fill(); }
  // player
  const P = S.player;
  ctx.fillStyle = hasMod('shield') ? '#7df' : '#fff';
  ctx.beginPath(); ctx.arc(P.x, P.y, 14, 0, 6.28); ctx.fill();
  if (hasMod('shield')) {
    ctx.strokeStyle = 'rgba(120,220,255,.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(P.x, P.y, 20, 0, 6.28); ctx.stroke();
  }
  for (const p of S.particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  // HUD text
  document.getElementById('hpfill').style.width = `${Math.max(0, (P.hp / P.max) * 100)}%`;
  document.getElementById('hpfill').style.background = P.hp > 50 ? '#4f4' : P.hp > 25 ? '#fa4' : '#f44';
  document.getElementById('score').textContent = `${S.score} очков · волна ${S.wave}`;
  document.getElementById('timer').textContent = GameKit.fmtTime(S.roundLeft);
  document.getElementById('mods').innerHTML =
    S.mods.map((m) => `${m.label} (${Math.ceil((m.until - Date.now()) / 1000)}с)`).join('<br>');
  document.getElementById('board').innerHTML =
    GameKit.leaderboard(S.supporters, 5).map((r, i) => `${i + 1}. ${r.user} — ${GameKit.fmtNum(r.score)}`).join('<br>');
}

async function main() {
  HUD = GameKit.hud();
  const { cfg } = await GameKit.fetchCfg(GAME);
  S.cfg = cfg; S.eng = new GameKit.Engine(cfg);
  S.roundLeft = cfg.round_sec || 300;
  S.player.x = cv.width / 2; S.player.y = cv.height / 2;
  S.waveT = 2;
  GameKit.connect(['game'], (ev) => {
    if (ev.event_kind === 'gift') { S.stats.gifts++; S.stats.coins += ev.coins || 0; }
    S.eng.feed(ev);
  }, (s) => HUD.setStatus(s));
  GameKit.watchSession(GAME, (status) => {
    document.getElementById('pause').style.display = status === 'paused' ? 'grid' : 'none';
    S.running = status === 'running' && !S.over;
  });
  HUD.banners.push('SURVIVE THE HORDE — кликните окно и играйте WASD!', 'big');
  GameKit.loop(step, draw);
}
{
  const s = document.createElement('script');
  s.src = '/gamekit.js?t=' + encodeURIComponent(new URLSearchParams(location.search).get('t') || '');
  s.onload = () => main().catch((e) => {
    document.body.innerHTML = `<pre style="color:#f66;padding:20px">${e}</pre>`;
  });
  s.onerror = () => { document.body.innerHTML = '<pre style="color:#f66;padding:20px">gamekit: 403 — проверьте токен</pre>'; };
  document.head.appendChild(s);
}
</script></body></html>
