<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>chlauncher · goals</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
  }
  #goals { position: absolute; left: 12px; bottom: 12px; width: 300px;
           display: flex; flex-direction: column; gap: 8px; }
  .bar { background: rgba(15,17,26,.85); border: 1px solid rgba(255,255,255,.1);
         border-radius: 10px; padding: 8px 12px; }
  .bar .head { display: flex; justify-content: space-between; gap: 8px;
               font-size: 12px; margin-bottom: 6px; }
  .bar .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .num { font-variant-numeric: tabular-nums; color: rgba(255,255,255,.75); }
  .bar .track { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12);
                overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 4px;
               background: linear-gradient(90deg,#0ea5e9,#22c55e);
               transition: width .35s ease; }
  .bar.done { border-color: #22c55e; }
  .bar.done .fill { background: #22c55e; }
  .bar.done .num { color: #22c55e; }
</style>
</head>
<body>
<div id="goals"></div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('t') || '';
// ?bg=rrggbb — solid chroma background for LIVE Studio window capture
// (real transparency doesn't survive every capture path).
const _bg = params.get('bg');
if (_bg && /^[0-9a-fA-F]{6}$/.test(_bg)) document.body.style.background = '#' + _bg;
const goals = document.getElementById('goals');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(items) {
  goals.innerHTML = (items || []).filter(g => g.enabled).map(g => {
    const pct = g.target > 0 ? Math.min(100, Math.round(g.value / g.target * 100)) : 0;
    return `<div class="bar${g.done ? ' done' : ''}">` +
      `<div class="head"><span class="label">${esc(g.label)}</span>` +
      `<b class="num">${g.value}/${g.target}</b></div>` +
      `<div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

async function tick() {
  try {
    const r = await fetch(`/goals.json?t=${encodeURIComponent(token)}`);
    if (r.ok) render(await r.json());
  } catch (_) { /* overlay server restarting — retry next tick */ }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
